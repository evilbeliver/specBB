<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Deer head in gold/yellow -->
  <g>
    <!-- Main head outline -->
    <path d="M200 120c-35 0-60 25-60 60v40c0 15 12 27 27 27h66c15 0 27-12 27-27v-40c0-35-25-60-60-60z" 
          fill="#DAA520" stroke="#B8860B" stroke-width="2"/>
    
    <!-- Inner head details -->
    <path d="M175 160c0-20 11-35 25-35s25 15 25 35v20c0 8-11 15-25 15s-25-7-25-15v-20z" 
          fill="#FFD700"/>
    
    <!-- Snout -->
    <ellipse cx="200" cy="210" rx="12" ry="8" fill="#DAA520"/>
    
    <!-- Eyes -->
    <circle cx="185" cy="175" r="4" fill="white"/>
    <circle cx="215" cy="175" r="4" fill="white"/>
    <circle cx="185" cy="175" r="2" fill="black"/>
    <circle cx="215" cy="175" r="2" fill="black"/>
    
    <!-- Ears -->
    <ellipse cx="165" cy="135" rx="8" ry="15" fill="#DAA520"/>
    <ellipse cx="235" cy="135" rx="8" ry="15" fill="#DAA520"/>
    
    <!-- Antlers in gold -->
    <g stroke="#DAA520" stroke-width="4" fill="none">
      <!-- Left antler main beam -->
      <path d="M180 110 L160 80 L145 50"/>
      <!-- Left antler points -->
      <path d="M170 95 L155 75"/>
      <path d="M160 80 L140 65"/>
      <path d="M150 65 L135 45"/>
      
      <!-- Right antler main beam -->
      <path d="M220 110 L240 80 L255 50"/>
      <!-- Right antler points -->
      <path d="M230 95 L245 75"/>
      <path d="M240 80 L260 65"/>
      <path d="M250 65 L265 45"/>
    </g>
    
    <!-- Filled antler tips -->
    <g fill="#FFD700">
      <circle cx="145" cy="50" r="3"/>
      <circle cx="155" cy="75" r="2"/>
      <circle cx="140" cy="65" r="2"/>
      <circle cx="135" cy="45" r="2"/>
      <circle cx="255" cy="50" r="3"/>
      <circle cx="245" cy="75" r="2"/>
      <circle cx="260" cy="65" r="2"/>
      <circle cx="265" cy="45" r="2"/>
    </g>
  </g>
  
  <!-- Feather in beige/tan -->
  <g>
    <!-- Main feather shape -->
    <path d="M240 200 Q280 180 320 220 Q300 280 260 300 Q250 250 240 200z" 
          fill="#D2B48C" stroke="#CD853F" stroke-width="2"/>
    
    <!-- Feather shaft -->
    <path d="M250 210 Q285 190 310 230" stroke="#8B7355" stroke-width="3" fill="none"/>
    
    <!-- Feather barbs -->
    <g stroke="#A0826D" stroke-width="1.5" fill="none">
      <path d="M255 220 Q275 210 290 225"/>
      <path d="M260 235 Q275 225 285 240"/>
      <path d="M265 250 Q275 240 280 255"/>
      <path d="M270 265 Q275 255 278 270"/>
      <path d="M275 280 Q278 270 280 285"/>
    </g>
    
    <!-- Feather texture lines -->
    <g stroke="#BC9A6A" stroke-width="1" fill="none" opacity="0.7">
      <path d="M250 215 Q270 205 285 220"/>
      <path d="M258 230 Q270 220 280 235"/>
      <path d="M263 245 Q270 235 275 250"/>
      <path d="M268 260 Q270 250 273 265"/>
    </g>
  </g>
</svg>