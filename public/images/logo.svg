<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Deer head -->
  <g fill="#4a5d23">
    <!-- Main head shape -->
    <path d="M400 180c-50 0-90 40-90 90v60c0 20 16 36 36 36h108c20 0 36-16 36-36v-60c0-50-40-90-90-90z"/>
    
    <!-- Snout -->
    <ellipse cx="400" cy="320" rx="25" ry="15" fill="#4a5d23"/>
    
    <!-- Eyes -->
    <circle cx="370" cy="260" r="8" fill="white"/>
    <circle cx="430" cy="260" r="8" fill="white"/>
    <circle cx="370" cy="260" r="4" fill="black"/>
    <circle cx="430" cy="260" r="4" fill="black"/>
    
    <!-- Ears -->
    <ellipse cx="340" cy="200" rx="15" ry="25" fill="#4a5d23"/>
    <ellipse cx="460" cy="200" rx="15" ry="25" fill="#4a5d23"/>
    
    <!-- Antlers -->
    <g stroke="#4a5d23" stroke-width="8" fill="none">
      <!-- Left antler main beam -->
      <path d="M365 160 L340 120 L320 80"/>
      <!-- Left antler points -->
      <path d="M350 140 L330 110"/>
      <path d="M340 120 L315 100"/>
      <path d="M330 100 L310 75"/>
      
      <!-- Right antler main beam -->
      <path d="M435 160 L460 120 L480 80"/>
      <!-- Right antler points -->
      <path d="M450 140 L470 110"/>
      <path d="M460 120 L485 100"/>
      <path d="M470 100 L490 75"/>
    </g>
  </g>
  
  <!-- Feather -->
  <g fill="#8B4513">
    <path d="M480 300 Q520 280 560 320 Q540 360 500 380 Q490 340 480 300z"/>
    <!-- Feather detail lines -->
    <g stroke="#654321" stroke-width="2" fill="none">
      <path d="M490 310 Q520 300 540 320"/>
      <path d="M495 325 Q520 315 535 335"/>
      <path d="M500 340 Q520 330 530 350"/>
      <path d="M505 355 Q520 345 525 365"/>
    </g>
  </g>
</svg>