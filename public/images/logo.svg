<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F4D03F"/>
      <stop offset="50%" style="stop-color:#F1C40F"/>
      <stop offset="100%" style="stop-color:#D68910"/>
    </linearGradient>
    <linearGradient id="featherGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F9F9"/>
      <stop offset="40%" style="stop-color:#D5DBDB"/>
      <stop offset="100%" style="stop-color:#AEB6BF"/>
    </linearGradient>
  </defs>
  
  <!-- Deer Head Silhouette -->
  <g fill="url(#goldGradient)">
    <!-- Main head shape -->
    <path d="M150 90c-30 0-50 25-50 55v40c0 12 10 22 22 22h56c12 0 22-10 22-22v-40c0-30-20-55-50-55z"/>
    
    <!-- Snout -->
    <ellipse cx="150" cy="185" rx="15" ry="10"/>
    
    <!-- Neck area -->
    <path d="M130 205c0-8 9-15 20-15s20 7 20 15v12c0 4-9 8-20 8s-20-4-20-8v-12z"/>
    
    <!-- Ears -->
    <ellipse cx="125" cy="100" rx="8" ry="15" transform="rotate(-20 125 100)"/>
    <ellipse cx="175" cy="100" rx="8" ry="15" transform="rotate(20 175 100)"/>
    
    <!-- Facial details for silhouette -->
    <path d="M135 140c0-8 7-15 15-15s15 7 15 15v8c0-4-7-8-15-8s-15 4-15 8v-8z"/>
    <path d="M140 125c0-3 4-6 10-6s10 3 10 6c0 2-4 4-10 4s-10-2-10-4z"/>
    
    <!-- Antlers with detailed branching -->
    <g stroke="url(#goldGradient)" stroke-width="2.5" fill="none" stroke-linecap="round">
      <!-- Left main antler -->
      <path d="M135 85 L125 60 L118 40 L115 25"/>
      <!-- Left antler points -->
      <path d="M130 75 L120 55"/>
      <path d="M125 60 L115 45"/>
      <path d="M120 50 L110 35"/>
      <path d="M118 40 L108 25"/>
      
      <!-- Right main antler -->
      <path d="M165 85 L175 60 L182 40 L185 25"/>
      <!-- Right antler points -->
      <path d="M170 75 L180 55"/>
      <path d="M175 60 L185 45"/>
      <path d="M180 50 L190 35"/>
      <path d="M182 40 L192 25"/>
    </g>
    
    <!-- Antler tips -->
    <g fill="url(#goldGradient)">
      <circle cx="115" cy="25" r="2"/>
      <circle cx="120" cy="55" r="1.5"/>
      <circle cx="115" cy="45" r="1.5"/>
      <circle cx="110" cy="35" r="1.5"/>
      <circle cx="108" cy="25" r="1.5"/>
      <circle cx="185" cy="25" r="2"/>
      <circle cx="180" cy="55" r="1.5"/>
      <circle cx="185" cy="45" r="1.5"/>
      <circle cx="190" cy="35" r="1.5"/>
      <circle cx="192" cy="25" r="1.5"/>
    </g>
  </g>
  
  <!-- Feather -->
  <g>
    <!-- Main feather shape -->
    <path d="M220 115 Q265 95 305 135 Q295 195 255 215 Q240 165 220 115z" 
          fill="url(#featherGradient)" stroke="#BDC3C7" stroke-width="1"/>
    
    <!-- Feather center shaft -->
    <path d="M235 125 Q270 105 295 150" stroke="#85929E" stroke-width="1.5" fill="none"/>
    
    <!-- Feather barbs -->
    <g stroke="#AEB6BF" stroke-width="0.8" fill="none" opacity="0.9">
      <path d="M240 135 Q258 130 275 140"/>
      <path d="M245 150 Q258 145 270 155"/>
      <path d="M250 165 Q258 160 265 170"/>
      <path d="M255 180 Q260 175 263 185"/>
      <path d="M260 195 Q263 190 265 200"/>
    </g>
    
    <!-- Additional feather texture -->
    <g stroke="#D5DBDB" stroke-width="0.6" fill="none" opacity="0.7">
      <path d="M242 130 Q255 125 270 135"/>
      <path d="M247 145 Q255 140 265 150"/>
      <path d="M252 160 Q255 155 260 165"/>
      <path d="M257 175 Q260 170 262 180"/>
    </g>
    
    <!-- Feather tip -->
    <ellipse cx="305" cy="135" rx="2" ry="6" fill="url(#featherGradient)"/>
  </g>
</svg>