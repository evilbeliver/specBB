<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <!-- Modern white gradient for clean look on green background -->
    <linearGradient id="whiteGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1"/>
    </linearGradient>
    
    <!-- Subtle shadow for depth -->
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- White-tailed Deer Buck Head - Sleek, Modern Design -->
  <g filter="url(#softShadow)">
    <!-- Deer Head Profile -->
    <g fill="url(#whiteGradient)" stroke="#ffffff" stroke-width="0.5" stroke-linejoin="round">
      <!-- Main head and neck -->
      <path d="M180 320 
               C175 310 170 295 168 280
               L168 240
               C168 220 170 200 175 185
               C180 170 190 155 200 145
               L200 140
               C200 135 198 130 195 126
               L190 115
               C188 110 186 105 186 100
               L186 90
               C186 85 188 80 192 77
               L200 70
               C205 67 210 65 215 65
               C220 65 225 67 228 70
               C230 72 232 75 232 78
               L232 85
               C232 90 230 95 227 98
               L225 105
               C224 110 224 115 225 120
               L228 130
               C230 135 233 138 236 140
               L245 147
               C255 157 262 170 266 185
               C270 200 272 220 272 240
               L272 280
               C270 295 265 310 260 320
               Z" 
               opacity="0.98"/>
      
      <!-- Snout detail -->
      <ellipse cx="220" cy="148" rx="12" ry="8" opacity="0.95"/>
      
      <!-- Eye area -->
      <circle cx="210" cy="110" r="3" fill="#2c5530"/>
      
      <!-- Ear -->
      <path d="M195 75 
               L185 55
               C183 50 182 45 183 40
               L185 35
               C186 32 189 30 192 30
               C195 30 198 32 199 35
               L202 45
               C203 52 202 60 199 67
               Z" 
               opacity="0.92"/>
    </g>
    
    <!-- Majestic Antlers - Sleek Lines -->
    <g stroke="url(#whiteGradient)" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Main beam left -->
      <path d="M198 72 
               L190 55
               L185 35
               L182 15" 
               opacity="0.98"/>
      
      <!-- Left tines -->
      <path d="M195 65 L185 50" opacity="0.95"/>
      <path d="M190 52 L180 38" opacity="0.95"/>
      <path d="M187 40 L177 25" opacity="0.95"/>
      <path d="M185 30 L175 15" opacity="0.95"/>
      <path d="M183 20 L173 8" opacity="0.95"/>
      
      <!-- Main beam right -->
      <path d="M228 73
               L235 55
               L240 35
               L243 15" 
               opacity="0.98"/>
      
      <!-- Right tines -->
      <path d="M230 65 L240 50" opacity="0.95"/>
      <path d="M235 52 L245 38" opacity="0.95"/>
      <path d="M238 40 L248 25" opacity="0.95"/>
      <path d="M240 30 L250 15" opacity="0.95"/>
      <path d="M242 20 L252 8" opacity="0.95"/>
      
      <!-- Additional crown tines for majestic look -->
      <path d="M182 15 L180 5" opacity="0.92"/>
      <path d="M243 15 L245 5" opacity="0.92"/>
    </g>
    
    <!-- Turkey Feather - Elegant Accent -->
    <g opacity="0.95">
      <!-- Main feather shape -->
      <path d="M260 180
               Q280 160 305 170
               Q320 180 325 200
               Q328 220 320 240
               Q310 255 295 260
               Q280 265 270 255
               Q265 245 262 230
               Q260 210 260 180
               Z" 
               fill="url(#whiteGradient)" 
               stroke="#ffffff" 
               stroke-width="1.5"
               opacity="0.9"/>
      
      <!-- Center quill -->
      <path d="M268 190 Q282 175 312 220" 
            stroke="#f5f5f5" 
            stroke-width="2" 
            fill="none"
            opacity="0.85"/>
      
      <!-- Feather barbs - modern minimal style -->
      <g stroke="#f8f8f8" stroke-width="1.2" fill="none" opacity="0.75">
        <path d="M272 200 Q285 195 295 205"/>
        <path d="M275 215 Q285 210 292 220"/>
        <path d="M278 230 Q285 225 290 235"/>
        <path d="M282 245 Q287 240 290 248"/>
      </g>
      
      <!-- Feather texture lines -->
      <g stroke="#ffffff" stroke-width="0.8" fill="none" opacity="0.5">
        <path d="M274 205 Q282 200 290 210"/>
        <path d="M277 220 Q282 215 288 225"/>
        <path d="M280 235 Q284 230 288 240"/>
      </g>
    </g>
  </g>
</svg>