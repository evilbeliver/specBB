<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Deer head silhouette in gold -->
  <g fill="#DAA520">
    <!-- Main deer head outline -->
    <path d="M200 120c-40 0-70 30-70 70v50c0 15 12 25 25 25h90c13 0 25-10 25-25v-50c0-40-30-70-70-70z"/>
    
    <!-- Snout area -->
    <path d="M185 210c0-8 7-15 15-15s15 7 15 15v12c0 4-7 8-15 8s-15-4-15-8v-12z"/>
    
    <!-- Eye area highlights -->
    <circle cx="180" cy="175" r="3" fill="#FFD700"/>
    <circle cx="220" cy="175" r="3" fill="#FFD700"/>
    
    <!-- Ears -->
    <ellipse cx="155" cy="135" rx="10" ry="20" fill="#DAA520"/>
    <ellipse cx="245" cy="135" rx="10" ry="20" fill="#DAA520"/>
    
    <!-- Antlers with multiple points -->
    <g fill="#E6C200">
      <!-- Left main antler beam -->
      <path d="M170 110 L150 85 L135 50 Q132 45 135 45 Q140 50 145 55 L160 90 L180 115z"/>
      
      <!-- Left antler points -->
      <path d="M158 95 L142 75 Q140 72 142 72 Q145 75 148 80 L160 98z"/>
      <path d="M148 80 L132 60 Q130 57 132 57 Q135 60 138 65 L150 83z"/>
      <path d="M140 65 L125 45 Q123 42 125 42 Q128 45 131 50 L142 68z"/>
      
      <!-- Right main antler beam -->
      <path d="M230 110 L250 85 L265 50 Q268 45 265 45 Q260 50 255 55 L240 90 L220 115z"/>
      
      <!-- Right antler points -->
      <path d="M242 95 L258 75 Q260 72 258 72 Q255 75 252 80 L240 98z"/>
      <path d="M252 80 L268 60 Q270 57 268 57 Q265 60 262 65 L250 83z"/>
      <path d="M260 65 L275 45 Q277 42 275 42 Q272 45 269 50 L258 68z"/>
    </g>
  </g>
  
  <!-- Feather in beige/tan with gradient effect -->
  <defs>
    <linearGradient id="featherGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5DEB3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#DEB887;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D2B48C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <g>
    <!-- Main feather shape -->
    <path d="M250 200 Q290 180 330 220 Q310 280 270 300 Q260 250 250 200z" 
          fill="url(#featherGradient)" stroke="#CD853F" stroke-width="1.5"/>
    
    <!-- Feather center shaft -->
    <path d="M260 210 Q295 190 320 235" stroke="#8B7355" stroke-width="2.5" fill="none"/>
    
    <!-- Feather barb details -->
    <g stroke="#A0826D" stroke-width="1" fill="none" opacity="0.8">
      <path d="M265 220 Q285 210 305 225"/>
      <path d="M270 235 Q285 225 300 240"/>
      <path d="M275 250 Q285 240 295 255"/>
      <path d="M280 265 Q285 255 290 270"/>
      <path d="M285 280 Q288 270 290 285"/>
    </g>
    
    <!-- Additional feather texture -->
    <g stroke="#BC9A6A" stroke-width="0.8" fill="none" opacity="0.6">
      <path d="M262 215 Q280 205 295 220"/>
      <path d="M268 230 Q280 220 290 235"/>
      <path d="M273 245 Q280 235 285 250"/>
      <path d="M278 260 Q280 250 283 265"/>
      <path d="M283 275 Q285 265 287 280"/>
    </g>
  </g>
</svg>