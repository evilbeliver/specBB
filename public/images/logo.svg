<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4D03F"/>
      <stop offset="50%" stop-color="#F1C40F"/>
      <stop offset="100%" stop-color="#D68910"/>
    </linearGradient>
    <linearGradient id="feather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F9F9"/>
      <stop offset="40%" stop-color="#D5DBDB"/>
      <stop offset="100%" stop-color="#AEB6BF"/>
    </linearGradient>
  </defs>
  
  <!-- Deer Head -->
  <g fill="url(#gold)">
    <path d="M150 90c-30 0-50 25-50 55v40c0 12 10 22 22 22h56c12 0 22-10 22-22v-40c0-30-20-55-50-55z"/>
    <ellipse cx="150" cy="185" rx="15" ry="10"/>
    <ellipse cx="125" cy="100" rx="8" ry="15" transform="rotate(-20 125 100)"/>
    <ellipse cx="175" cy="100" rx="8" ry="15" transform="rotate(20 175 100)"/>
    
    <!-- Antlers -->
    <g stroke="url(#gold)" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M135 85 L125 60 L118 40 L115 25"/>
      <path d="M130 75 L120 55"/>
      <path d="M125 60 L115 45"/>
      <path d="M165 85 L175 60 L182 40 L185 25"/>
      <path d="M170 75 L180 55"/>
      <path d="M175 60 L185 45"/>
    </g>
    
    <g fill="url(#gold)">
      <circle cx="115" cy="25" r="2"/>
      <circle cx="120" cy="55" r="1.5"/>
      <circle cx="185" cy="25" r="2"/>
      <circle cx="180" cy="55" r="1.5"/>
    </g>
  </g>
  
  <!-- Feather -->
  <g>
    <path d="M220 115 Q265 95 305 135 Q295 195 255 215 Q240 165 220 115z" 
          fill="url(#feather)" stroke="#BDC3C7" stroke-width="1"/>
    <path d="M235 125 Q270 105 295 150" stroke="#85929E" stroke-width="1.5" fill="none"/>
    <g stroke="#AEB6BF" stroke-width="0.8" fill="none">
      <path d="M240 135 Q258 130 275 140"/>
      <path d="M245 150 Q258 145 270 155"/>
      <path d="M250 165 Q258 160 265 170"/>
