name: Minimal Test

on:
  workflow_dispatch:

# Absolutely no concurrency constraints
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    
    steps:
      - name: Simple test
        run: |
          echo "Test running at: $(date)"
          echo "Workflow ID: ${{ github.run_id }}"
          echo "✅ Minimal workflow works!"