name: CI

on:
  push:
    branches: [main, '001-hunt-club-website', 'develop', 'feature/*']
  pull_request:
    branches: [main, '001-hunt-club-website']

# No concurrency - allow parallel runs

jobs:
  health-check:
    runs-on: ubuntu-22.04  # Try specific version instead of latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.9.0'
      
      - name: Check Node version
        run: node --version
        
      - name: Check npm version  
        run: npm --version

  lint-and-test:
    runs-on: ubuntu-22.04
    needs: health-check
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.9.0'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        timeout-minutes: 10
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      
      - name: Run linter
        run: npm run lint
        timeout-minutes: 3
      
      - name: Run unit tests
        run: npm test -- --passWithNoTests
        timeout-minutes: 5
      
      - name: Build project
        run: npm run build
        timeout-minutes: 5

  e2e-tests:
    runs-on: ubuntu-22.04
    needs: lint-and-test
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.9.0'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        timeout-minutes: 10
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      
      - name: Build project (for production validation)
        run: npm run build
        timeout-minutes: 5
        
      - name: List build output (for debugging)
        run: ls -la out/
        
      - name: Run E2E tests against development server
        run: npx start-server-and-test 'npm run dev -- --hostname 0.0.0.0 --port 3000' http://localhost:3000 'npx cypress run --headless'
        timeout-minutes: 10
