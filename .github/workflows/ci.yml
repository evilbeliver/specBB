name: CI

on:
  push:
    branches: [main, '001-hunt-club-website', 'develop', 'feature/*']
  pull_request:
    branches: [main, '001-hunt-club-website']

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      TERM: xterm
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint
      
      - name: Run tests
        run: npm test
      
      - name: Run accessibility tests
        run: npm run test:accessibility
      
      - name: Build project
        run: npm run build
        
      - name: Start server and run E2E tests
        run: |
          npm install -g serve wait-on
          serve out -l 3000 &
          wait-on http://localhost:3000 --timeout 60000
          npm run test:e2e
        
      - name: Upload test coverage
        uses: codecov/codecov-action@v3
        if: always()
