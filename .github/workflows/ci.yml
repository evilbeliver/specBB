name: CI

on:
  push:
    branches: [main, '001-hunt-club-website', 'develop', 'feature/*']
  pull_request:
    branches: [main, '001-hunt-club-website']

# No concurrency - allow parallel runs

jobs:
  health-check:
    runs-on: ubuntu-22.04  # Try specific version instead of latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Check Node version
        run: node --version
        
      - name: Check npm version  
        run: npm --version

  lint-and-test:
    runs-on: ubuntu-latest
    needs: health-check
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
        timeout-minutes: 5
      
      - name: Run linter
        run: npm run lint
        timeout-minutes: 3
      
      - name: Run unit tests
        run: npm test -- --passWithNoTests
        timeout-minutes: 5
      
      - name: Build project
        run: npm run build
        timeout-minutes: 5

  e2e-tests:
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
        timeout-minutes: 5
      
      - name: Build project
        run: npm run build
        timeout-minutes: 5
        
      - name: Run E2E tests
        run: npx start-server-and-test 'npx serve out -l 3000 -s' http://localhost:3000 'npx cypress run --headless'
        timeout-minutes: 10
