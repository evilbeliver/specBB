name: Force Cancel All

on:
  workflow_dispatch:

# No concurrency group to avoid any blocking
jobs:
  force-cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    
    steps:
      - name: Cancel queued workflows via API
        run: |
          echo "Attempting to cancel all queued workflows..."
          curl -X GET \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=queued" \
            | jq -r '.workflow_runs[].id' \
            | while read run_id; do
                echo "Cancelling run ID: $run_id"
                curl -X POST \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                  "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run_id/cancel"
              done || echo "No queued runs found or cancellation completed"
          
          echo "Force cancel attempt completed"